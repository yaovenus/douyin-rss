name: Check RSS Feed

on:
  schedule:
    # 每 12 小时运行一次 (可自行修改，比如 */15)
    - cron: '0 */12 * * *'
  workflow_dispatch: # 允许手动点击运行测试

jobs:
  check_rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予写入权限，以便更新记录文件
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 👇 这一行非常重要，必须加！否则脚本读不到 Secrets
        TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
      run: python main.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        # 如果 last_processed_id.txt 有变化，就提交回仓库
        git add last_processed_id.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update last processed ID" && git push)
